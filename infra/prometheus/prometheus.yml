global:
  scrape_interval: 5s

scrape_configs:
  - job_name: job-service
    metrics_path: /metrics
    static_configs: [{targets: ["job-service:8000"]}]
  - job_name: audio-service
    static_configs: [{targets: ["audio-service:8000"]}]
  - job_name: transcription-service
    static_configs: [{targets: ["transcription-service:8000"]}]
  - job_name: translation-service
    static_configs: [{targets: ["translation-service:8000"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
